services:
  web-app-1:
    image: registry.gitlab.com/booowieee/infrastructure-blueprint:latest
    container_name: web-app-1
    restart: unless-stopped
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=${DB_NAME:-app_db}
      - DB_USER=${DB_USER:-db_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
    networks:
      - app-network

  web-app-2:
    image: registry.gitlab.com/booowieee/infrastructure-blueprint:latest
    container_name: web-app-2
    restart: unless-stopped
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=${DB_NAME:-app_db}
      - DB_USER=${DB_USER:-db_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app-1
      - web-app-2
    networks:
      - app-network

networks:
  app-network:
    external: true
